name: fp_probe
options:
  deploymentTarget: { iOS: "14.0" }
targets:
  fp_probe:
    type: application
    platform: iOS
    sources: [fp_probe]
    info:
      path: fp_probe/Info.plist
      properties:
        CFBundleDisplayName: fp_probe
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities: [arm64]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        # No NSBonjourServices, no NSLocalNetworkUsageDescription — with NSAllowsLocalNetworking iOS
        # doesn't need to prompt.  Public-IP target (wroblox.xyz → 45.137.43.44) is not local anyway.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pattest.fpprobe
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
